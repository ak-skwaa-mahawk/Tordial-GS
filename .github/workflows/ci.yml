name: CI & Scientific Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Core Test Suite (88 Tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest pytest-asyncio pytest-cov numpy
          fi

      - name: Execute pytest Matrix
        env:
          PYTHONPATH: .
        run: |
          pytest -v

  replica-benchmarks:
    name: Grok Replica Invariant Evaluation
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest pytest-asyncio pytest-cov numpy
          fi

      - name: Run Scientific Replica Benchmarks
        env:
          PYTHONPATH: .
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::warning title=XAI_API_KEY Missing::Skipping live remote Grok evaluation (secret not set in repository settings)."
            pytest tests/test_grok_eval.py -v
          else
            python3 scripts/run_grok_eval.py
          fi
